[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "modexai"
version = "1.0.0"
description = "The local model exchange for AI agents. Find, test and hire small open models that run on your machine — your data never leaves. A Nokast tool."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Abhishek Rai", email = "abhishek.rai085@gmail.com" }]
keywords = [
  "ai-agents", "mcp", "model-context-protocol", "ollama", "local-llm", "small-language-models",
  "slm", "lora", "llm-evaluation", "benchmark", "privacy", "local-first", "claude-code", "nokast",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "httpx>=0.27",
  "rich>=13.7",
  "mcp>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.urls]
Homepage = "https://abhishek085.github.io/modexai/"
Repository = "https://github.com/abhishek085/modexai"
Issues = "https://github.com/abhishek085/modexai/issues"
Newsletter = "https://nokast.substack.com"

[project.scripts]
modexai = "modexai.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/modexai"]

[tool.hatch.build.targets.sdist]
include = ["src", "registry", "tests", "README.md", "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]
