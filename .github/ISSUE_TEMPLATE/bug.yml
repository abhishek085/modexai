name: Bug report
description: Something doesn't work.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Include the command or MCP tool call and the output.
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Output of `modexai doctor --json`
      render: json
