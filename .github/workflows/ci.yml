name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.10", "3.11", "3.12", "3.13"]
        include:
          - os: macos-latest
            python: "3.12"
          - os: windows-latest
            python: "3.12"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv venv --python ${{ matrix.python }}
      - run: uv pip install -e ".[dev]"
      - name: Lint
        if: matrix.os == 'ubuntu-latest'
        run: uv run --no-sync ruff check .
      - name: Tests (simulated backend — no Ollama needed)
        run: uv run --no-sync pytest -q
      - name: Registry and recipes are valid and the bundled index is up to date
        run: uv run --no-sync modexai registry --check
